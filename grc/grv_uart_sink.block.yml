id: grv_uart_sink
label: 'UART Sink'
category: '[OpenGRV]/Peripheral endpoints'
flags: [ python ]

parameters:
-   id: type
    label: 'Type'
    dtype: enum
    default: 'short'
    options: [complex, float, int, short, byte]
    option_attributes:
        size: [gr.sizeof_gr_complex, gr.sizeof_float, gr.sizeof_int, gr.sizeof_short, gr.sizeof_char]
    hide: part
-   id: baud
    label: 'Baud rate'
    dtype: real
    default: '115200'
-   id: parity
    label: 'Parity'
    dtype: enum
    default: 'none'
    options: [none, even, odd]
    option_labels: ['None', 'Even', 'Odd']
-   id: stop_bits
    label: 'Stop bits'
    dtype: int
    default: '1'
    options: [1, 2]
    hide: part
-   id: flow
    label: 'RTS/CTS flow control'
    dtype: bool
    default: 'False'
    hide: part
-   id: msb_first
    label: 'Most significant byte first'
    dtype: bool
    default: 'False'
    hide: part
    category: 'Advanced'
-   id: invert
    label: 'Inverted lines'
    dtype: bool
    default: 'False'
    hide: part
    category: 'Advanced'
-   id: gap
    label: 'Gap (bit times)'
    dtype: int
    default: '0'
    hide: part
    category: 'Advanced'
-   id: text
    label: 'Hexadecimal text'
    dtype: bool
    default: 'False'
-   id: drop
    label: 'Drop when full'
    dtype: bool
    default: 'False'
    hide: part
-   id: depth
    label: 'FIFO depth'
    dtype: int
    default: '32'
    hide: part
    category: 'Advanced'
-   id: sim_file
    label: 'Simulation file'
    dtype: file_open
    default: ''
    hide: part
    category: 'Simulation'

inputs:
-   domain: stream
    dtype: ${ type }

templates:
    imports: |-
        from gnuradio import blocks, gr
    make: |-
        blocks.file_sink(${type.size}, ${sim_file}, False) if ${sim_file} else blocks.null_sink(${type.size})

documentation: |-
    Peripheral endpoint (OpenGRV): samples sent on <name>_txd as ceil(W/8) bytes, or as hexadecimal text
    (ceil(W/4) digits and a space or a line feed). With drop, the graph never waits for the line.
    In GNU Radio the block writes the simulation file.

file_format: 1
